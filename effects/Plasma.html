<!doctype html>
<html>
<head>
<title>Plasma</title>
<meta description="Organic flowing plasma in two colours."/>
<meta publisher="Cuttlefish"/>
<meta property="colorA" label="Color A" type="color" default="#00e1ff" min="0" max="360"/>
<meta property="colorB" label="Color B" type="color" default="#ff00aa" min="0" max="360"/>
<meta property="speed" label="Speed" type="number" min="1" max="100" default="30"/>
<meta property="scale" label="Scale" type="number" min="5" max="100" default="35"/>
</head>
<body style="margin:0;background:#000">
<canvas id="exCanvas" width="320" height="200"></canvas>
<script>
const c = document.getElementById('exCanvas');
const ctx = c.getContext('2d');
const W = 320, H = 200;
let t = 0;
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function frame() {
  t += speed / 800;
  const a = hex(colorA), b = hex(colorB);
  const img = ctx.createImageData(W, H), d = img.data;
  const s = scale / 1000;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = (Math.sin(x * s * 3 + t * 3) + Math.sin((y * s * 4) + t * 2) + Math.sin((x + y) * s * 2 + t) + Math.sin(Math.hypot(x - 160, y - 100) * s * 4 - t * 4)) / 4;
    const m = 0.5 + 0.5 * v;
    const i = (y * W + x) * 4;
    d[i] = a[0] + (b[0] - a[0]) * m; d[i + 1] = a[1] + (b[1] - a[1]) * m; d[i + 2] = a[2] + (b[2] - a[2]) * m; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
