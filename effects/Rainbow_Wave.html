<!doctype html>
<html>
<head>
<title>Rainbow Wave</title>
<meta description="A smooth rainbow sweeping across the whole PC."/>
<meta publisher="Cuttlefish"/>
<meta property="speed" label="Speed" type="number" min="1" max="100" default="35"/>
<meta property="direction" label="Direction" type="list" values="Right,Left,Down,Up,Diagonal,Radial" default="Right"/>
<meta property="width" label="Wave width" type="number" min="10" max="400" default="160"/>
<meta property="saturation" label="Saturation" type="number" min="0" max="100" default="100"/>
</head>
<body style="margin:0;background:#000">
<canvas id="exCanvas" width="320" height="200"></canvas>
<script>
const c = document.getElementById('exCanvas');
const ctx = c.getContext('2d');
const W = 320, H = 200;
let t = 0;
function frame() {
  t += speed / 40;
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let p;
    switch (direction) {
      case 'Left': p = -x; break;
      case 'Down': p = y; break;
      case 'Up': p = -y; break;
      case 'Diagonal': p = (x + y) * 0.75; break;
      case 'Radial': p = Math.hypot(x - 160, y - 100); break;
      default: p = x;
    }
    const h = (((p - t) / width) * 360) % 360;
    const [r, g, b] = hsl((h + 360) % 360, saturation / 100, 0.5);
    const i = (y * W + x) * 4;
    d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}
function hsl(h, s, l) {
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
frame();
</script>
</body>
</html>
