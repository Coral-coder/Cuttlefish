<!doctype html>
<html>
<head>
<title>Hardware Monitor</title>
<meta description="Shows live CPU and GPU temperature and load, driven by your PC's sensors."/>
<meta publisher="Cuttlefish"/>
<meta property="metric" label="Colour follows" type="list" values="CPU temp,GPU temp,CPU load,GPU load" default="CPU temp"/>
<meta property="coolColor" label="Cool colour" type="color" default="#2bd4ff"/>
<meta property="hotColor" label="Hot colour" type="color" default="#ff3b3b"/>
<meta property="coolC" label="Cool point (°C)" type="number" min="20" max="60" default="40"/>
<meta property="hotC" label="Hot point (°C)" type="number" min="60" max="100" default="85"/>
<meta property="showText" label="Show readout" type="boolean" default="1"/>
<meta requirements="sensors"/>
</head>
<body style="margin:0;background:#000">
<canvas id="exCanvas" width="320" height="200"></canvas>
<script>
const c = document.getElementById('exCanvas'), ctx = c.getContext('2d'), W = 320, H = 200;
const hex = (h) => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
function lerp(a, b, t){ return a.map((v, i) => Math.round(v + (b[i]-v)*Math.max(0, Math.min(1, t)))); }
let pulse = 0;
function val() {
  const s = engine.sensors || {};
  const cpu = s.cpu || {}, gpu = s.gpu || {};
  switch (metric) {
    case 'GPU temp': return { v: gpu.temp, unit: '°C', label: 'GPU', norm: (gpu.temp - coolC)/(hotC - coolC) };
    case 'CPU load': return { v: cpu.usage, unit: '%', label: 'CPU', norm: (cpu.usage||0)/100 };
    case 'GPU load': return { v: gpu.usage, unit: '%', label: 'GPU', norm: (gpu.usage||0)/100 };
    default: return { v: cpu.temp, unit: '°C', label: 'CPU', norm: (cpu.temp - coolC)/(hotC - coolC) };
  }
}
function frame() {
  pulse += 0.05;
  const d = val();
  const cool = hex(coolColor), hot = hex(hotColor);
  const norm = Number.isFinite(d.norm) ? d.norm : 0;
  const col = lerp(cool, hot, norm);
  // background wash
  const bg = lerp(col.map(x => x*0.12), col.map(x => x*0.35), 0.5 + 0.5*Math.sin(pulse));
  ctx.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
  ctx.fillRect(0, 0, W, H);
  // bar
  const barH = H * Math.max(0.03, Math.min(1, norm));
  ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
  ctx.fillRect(0, H - barH, W, barH);
  if (showText) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 54px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    const txt = Number.isFinite(d.v) ? `${Math.round(d.v)}${d.unit}` : '—';
    ctx.fillText(txt, W/2, H/2 + 6);
    ctx.font = '20px Segoe UI, sans-serif';
    ctx.fillText(d.label, W/2, H/2 + 34);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
