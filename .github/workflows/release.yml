name: Release
# Every push to main builds Windows installers. When package.json carries a
# version that has not been released yet, the build is published as a GitHub
# Release; installed copies of Cuttlefish pick it up and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read version
        id: v
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release state
        id: exists
        shell: bash
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > assets.txt 2>/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            if grep -qx latest.yml assets.txt && grep -q '\.exe$' assets.txt; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "complete=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - name: Bundle PawnIO SMBus modules
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path dl, resources/pawnio | Out-Null
          gh release download --repo namazso/PawnIO.Modules --dir dl --pattern '*' --clobber
          Get-ChildItem dl -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath "dl/$($_.BaseName)" -Force }
          Get-ChildItem dl -Recurse -Include SmbusI801.bin,SmbusPIIX4.bin | Copy-Item -Destination resources/pawnio -Force
          Get-ChildItem resources/pawnio
      - name: Build
        shell: bash
        run: npx electron-builder --win --publish never
      - name: Publish release
        if: steps.exists.outputs.complete == 'false'
        shell: bash
        run: |
          tag="v${{ steps.v.outputs.version }}"
          files=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          ls -la "${files[@]}"
          if [ "${{ steps.exists.outputs.released }}" = "true" ]; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Cuttlefish ${{ steps.v.outputs.version }}" --notes "Automatic release. Installed copies update themselves."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cuttlefish-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn
